<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documents Explorer | Lunar Gateway</title>
    <meta
      name="description"
      content="A document explorer for Lunar Gateway."
    />
    <meta name="theme-color" content="#0b1624" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lunar Gateway Application Ecosystem" />
    <meta property="og:title" content="Documents Explorer | Lunar Gateway" />
    <meta
      property="og:description"
      content="A document explorer for Lunar Gateway."
    />
    <meta property="og:url" content="./" />
    <meta property="og:image" content="../suite-assets/lunar-gateway-share-card.svg" />
    <meta property="og:image:alt" content="Lunar Gateway Documents Explorer" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Documents Explorer | Lunar Gateway" />
    <meta
      name="twitter:description"
      content="A document explorer for Lunar Gateway."
    />
    <meta name="twitter:image" content="../suite-assets/lunar-gateway-share-card.svg" />
    <link rel="icon" type="image/svg+xml" href="../suite-assets/lunar-gateway-favicon.svg" />
    <link rel="stylesheet" href="../suite-assets/suite-context.css" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="../suite-assets/suite-shell.css" />
  </head>
  <body>
    <div class="app-shell">
      <nav class="suite-nav" aria-label="Gateway suite navigation">
        <a class="suite-nav__home" href="../" data-suite-route="simulation">Simulation</a>
        <div class="suite-nav__links">
          <a class="suite-nav__link" href="../overview/" data-suite-route="overview">Overview</a>
          <a class="suite-nav__link suite-nav__link--active" href="./" data-suite-route="documents" aria-current="page">Documents</a>
          <a class="suite-nav__link" href="../wbs/" data-suite-route="wbs">WBS</a>
          <a class="suite-nav__link" href="../schedule/" data-suite-route="schedule">Schedule</a>
          <a class="suite-nav__link" href="../cost/" data-suite-route="cost">Cost</a>
          <a class="suite-nav__link" href="../risk/" data-suite-route="risk">Risk</a>
          <a class="suite-nav__link" href="../confidence/" data-suite-route="confidence">Confidence</a>
          <button class="suite-nav__search" type="button" data-suite-search aria-label="Search the Gateway suite">
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M13.2 13.2 17 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span>Search</span>
            <span class="suite-nav__search-hint" data-suite-search-hint>Ctrl K</span>
          </button>
        </div>
      </nav>

      <header class="topbar">
        <div class="topbar__identity">
          <p class="topbar__eyebrow">Gateway Source Library</p>
          <h1 id="appTitle">Documents Explorer</h1>
          <p class="topbar__subtitle">
            The source files behind the cost, schedule, risk, and structure views.
          </p>
        </div>
      </header>

      <div id="contextBannerHost" class="suite-context-host"></div>

      <main class="workspace">
        <aside class="list-pane" aria-labelledby="listPaneTitle">
          <h2 id="listPaneTitle" class="sr-only">Documents</h2>

          <div class="list-controls">
            <div class="search-field">
              <label class="sr-only" for="searchInput">Search documents</label>
              <input
                id="searchInput"
                type="search"
                placeholder="Search documents"
                autocomplete="off"
              />
            </div>

            <div class="filter-row">
              <label class="sr-only" for="typeFilter">Filter by file type</label>
              <select id="typeFilter">
                <option value="">All file types</option>
              </select>

              <label class="sr-only" for="categoryFilter">Filter by category</label>
              <select id="categoryFilter">
                <option value="">All categories</option>
              </select>
            </div>
          </div>

          <div class="pane-header">
            <p id="resultsLabel" class="pane-header__meta">0 results</p>
            <button id="clearFiltersButton" class="text-button" type="button" hidden>Clear filters</button>
          </div>

          <div class="list-pane__body">
            <div id="listState" class="list-state" hidden></div>
            <div
              id="documentList"
              class="document-list"
              role="listbox"
              aria-label="Documents"
            ></div>
          </div>
        </aside>

        <section class="detail-pane" aria-label="Document detail pane">
          <div id="detailPaneContent" class="detail-pane__content"></div>
        </section>
      </main>
    </div>

    <script>
      (function () {
        const suitePorts = { documents: 4473, wbs: 4173, schedule: 4373, cost: 4273, risk: 4573 };
        const suiteHost = window.location.hostname || '127.0.0.1';
        const standalonePorts = new Set(Object.values(suitePorts).map(String));
        const runningStandalone = standalonePorts.has(String(window.location.port || ''));
        if (!runningStandalone) return;
        document.querySelectorAll('[data-suite-route]').forEach((link) => {
          const route = link.getAttribute('data-suite-route');
          if (route === 'simulation') {
            link.href = '/index.html';
            return;
          }
          if (!suitePorts[route]) return;
          link.href = `http://${suiteHost}:${suitePorts[route]}/${route}/`;
        });
      })();
    </script>
    <script type="module" src="./app.js"></script>
    <script type="module" src="../suite-assets/suite-shell.js"></script>
  </body>
</html>
