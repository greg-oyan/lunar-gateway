<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cost Explorer | Lunar Gateway</title>
  <meta
    name="description"
    content="A cost explorer for Lunar Gateway."
  />
  <meta name="theme-color" content="#0b1624" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Lunar Gateway Application Ecosystem" />
  <meta property="og:title" content="Cost Explorer | Lunar Gateway" />
  <meta
    property="og:description"
    content="A cost explorer for Lunar Gateway."
  />
  <meta property="og:url" content="./" />
  <meta property="og:image" content="../suite-assets/lunar-gateway-share-card.svg" />
  <meta property="og:image:alt" content="Lunar Gateway Cost Explorer" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Cost Explorer | Lunar Gateway" />
  <meta
    name="twitter:description"
    content="A cost explorer for Lunar Gateway."
  />
  <meta name="twitter:image" content="../suite-assets/lunar-gateway-share-card.svg" />
  <link rel="icon" type="image/svg+xml" href="../suite-assets/lunar-gateway-favicon.svg" />
  <link rel="stylesheet" href="../suite-assets/suite-context.css" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="../suite-assets/suite-shell.css" />
</head>
<body>
  <div class="app-shell">
    <nav class="suite-nav" aria-label="Gateway suite navigation">
      <a class="suite-nav__home" href="../" data-suite-route="simulation">Simulation</a>
      <div class="suite-nav__links">
        <a class="suite-nav__link" href="../overview/" data-suite-route="overview">Overview</a>
        <a class="suite-nav__link" href="../documents/" data-suite-route="documents">Documents</a>
        <a class="suite-nav__link" href="../wbs/" data-suite-route="wbs">WBS</a>
        <a class="suite-nav__link" href="../schedule/" data-suite-route="schedule">Schedule</a>
        <a class="suite-nav__link suite-nav__link--active" href="./" data-suite-route="cost" aria-current="page">Cost</a>
        <a class="suite-nav__link" href="../risk/" data-suite-route="risk">Risk</a>
        <a class="suite-nav__link" href="../confidence/" data-suite-route="confidence">Confidence</a>
        <button class="suite-nav__search" type="button" data-suite-search aria-label="Search the Gateway suite">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M13.2 13.2 17 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>Search</span>
          <span class="suite-nav__search-hint" data-suite-search-hint>Ctrl K</span>
        </button>
      </div>
    </nav>

    <header class="hero">
      <div class="hero__copy">
        <p class="eyebrow">Gateway Cost Lens</p>
        <h1 id="appTitle">Cost Explorer</h1>
        <p id="appSubtitle" class="hero__subtitle">
          Where the money sits across Gateway, by module and by year.
        </p>
      </div>
    </header>

    <main class="page">
      <section class="panel story-panel" aria-labelledby="activeViewHeading">
        <div class="story-panel__heading">
          <div id="viewSwitcher" class="view-switcher" role="group" aria-label="Cost view"></div>
          <div class="sr-only">
            <p id="activeViewKicker">Gateway Cost Map</p>
            <h2 id="activeViewHeading">Loading…</h2>
            <p id="activeViewSubcopy"></p>
          </div>
        </div>

        <div id="activeViewContent" class="active-view-content">
          <section class="loading-state">
            <h3>Loading…</h3>
          </section>
        </div>
      </section>
      <p id="snapshotStamp" class="page-stamp">Loading…</p>
    </main>
  </div>

  <script>
    (function () {
      const suitePorts = { documents: 4473, wbs: 4173, schedule: 4373, cost: 4273, risk: 4573 };
      const suiteHost = window.location.hostname || '127.0.0.1';
      const standalonePorts = new Set(Object.values(suitePorts).map(String));
      const runningStandalone = standalonePorts.has(String(window.location.port || ''));
      if (!runningStandalone) return;
      document.querySelectorAll('[data-suite-route]').forEach((link) => {
        const route = link.getAttribute('data-suite-route');
        if (route === 'simulation') {
          link.href = '/index.html';
          return;
        }
        if (!suitePorts[route]) return;
        link.href = `http://${suiteHost}:${suitePorts[route]}/${route}/`;
      });
    })();
  </script>
  <script type="module" src="./app.js"></script>
  <script type="module" src="../suite-assets/suite-shell.js"></script>
</body>
</html>
